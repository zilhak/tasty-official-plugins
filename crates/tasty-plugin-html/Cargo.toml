[package]
name = "tasty-plugin-html"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: HTML viewer surface (uses host webview overlay)"
repository = "https://github.com/zilhak/tasty-official-plugins"

[[bin]]
name = "tasty-plugin-html"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk.workspace = true
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
tasty-plugin-manifest.workspace = true

[lints]
workspace = true
