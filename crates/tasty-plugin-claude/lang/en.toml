help = "Claude session profile (settings JSON) to attach via --settings on resume. Persists on the surface and is inherited by future reboots until cleared with --clear-profile. Mutually exclusive with --profile"

[claude.cli.arg.reboot_args.profile]
help = "Registered Claude session profile or Stop-hook gate name(s) to attach, comma-separated for multiple (merged into one file — see 'claude profile-register' and 'claude gate-register'). Persists on the surface (re-resolved from the registry on each future reboot, so edits to the profile or gate are picked up) and is inherited until cleared with --clear-profile. Mutually exclusive with --profile-file"

[claude.cli.arg.codex_returns_args.retry]
help = "Put every pending result back in line to be sent now, including ones whose automatic retry stopped. The command does not wait for the sending, so the list it prints is the pending list at the time of the request"

[claude.cli.arg.remote_results_args.id]
help = "Result id from the completion log. Shows that result with its body; without it the command lists stored results without bodies"

[claude.cli.arg.children_args.format]
help = "Format: table | json. Default: table (parent ID table)"

[claude.cli.arg.children_args.workspace]
help = "Workspace (ID or name) of the children. Used only when called from a Codex conversation whose children are in more than one workspace"

[claude.cli.arg.kill_args.workspace]
help = "Workspace (ID or name) of the children. Used only when called from a Codex conversation whose children are in more than one workspace"

[claude.cli.arg.broadcast_args.workspace]
help = "Workspace (ID or name) of the children. Used only when called from a Codex conversation whose children are in more than one workspace"

[claude.cli.arg.respawn_args.workspace]
help = "Workspace (ID or name) of the children. Used only when called from a Codex conversation whose children are in more than one workspace"

[claude.cli.arg.reboot_args.clear_profile]
help = "Detach a previously attached session profile (path- or name-based) before resuming"

[claude.cli.arg.reboot_args.permission_mode]
help = "Child permission mode: acceptEdits|auto|bypassPermissions|manual|dontAsk|plan. Passed as --permission-mode and overrides default_permission_mode for this call. If omitted, use that plugin setting; inherit or no setting adds no flag, leaving Claude Code settings in control. An explicit mode cannot be combined with --profile/--profile-file that sets permissions.defaultMode."

[claude.cli.arg.child_profile_args.surface]
help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)"

[claude.cli.arg.child_profile_args.child_index]
help = "Child index to attach the profile to (as reported by 'claude children')"

[claude.cli.arg.child_profile_args.delay]
help = "Seconds to wait before killing the child's Claude (default: 5)"

[claude.cli.arg.child_profile_args.prompt]
help = "Extra text appended to the reboot notice prompt sent to the restarted child"

[claude.cli.arg.child_profile_args.profile_file]
help = "Claude session profile (settings JSON) to attach to the child via --settings on resume. Persists on the child surface and is inherited by its future reboots until cleared with --clear-profile. Mutually exclusive with --profile"

[claude.cli.arg.child_profile_args.profile]
help = "Registered Claude session profile or Stop-hook gate name(s) to attach to the child, comma-separated for multiple (merged into one file — see 'claude profile-register' and 'claude gate-register'). Persists on the child surface (re-resolved from the registry on each future reboot) and is inherited until cleared with --clear-profile. Mutually exclusive with --profile-file"

[claude.cli.arg.child_profile_args.clear_profile]
help = "Detach the child's previously attached session profile (path- or name-based) before resuming"

[claude.cli.arg.child_profile_args.permission_mode]
help = "Child permission mode: acceptEdits|auto|bypassPermissions|manual|dontAsk|plan. Passed as --permission-mode and overrides default_permission_mode for this call. If omitted, use that plugin setting; inherit or no setting adds no flag, leaving Claude Code settings in control. An explicit mode cannot be combined with --profile/--profile-file that sets permissions.defaultMode."

[claude.cli.arg.hook_args.event]
help = "Hook event name (e.g. stop, stop-failure, notification, session-end, prompt-submit, session-start, subagent-stop, pre-tool-use, post-tool-use, background-start)"

[claude.cli.arg.hook_args.surface]
help = "Surface ID the hook is firing for (defaults to caller's TASTY_SURFACE_ID)"

[claude.cli.arg.hook_args.session]
help = "Claude Code session ID. Auto-populated from stdin JSON 'session_id' when Claude Code invokes the hook."

[claude.cli.arg.hook_args.message]
help = "Hook message text (used for notification token extraction). Auto-populated from stdin JSON 'message'."

[claude.cli.arg.hook_args.notification_type]
help = "Claude Code notification subtype (e.g. permission_prompt, auth_success). Auto-populated from stdin JSON 'notification_type'. Decides whether the notification sets needs_input, sets active, or leaves the state unchanged. A missing value sets needs_input; an unlisted value leaves the state unchanged."

[claude.cli.arg.hook_args.error]
help = "API error kind that ended the turn (e.g. overloaded, rate_limit, server_error, authentication_failed). Auto-populated from stdin JSON 'error' on the StopFailure hook."

[claude.cli.arg.hook_args.prompt_id]
help = "Claude Code prompt/turn ID. Auto-populated from stdin JSON 'prompt_id' on the Stop hook. Pairs this stop with the Stop-hook gate decisions for the same turn."

[claude.cli.arg.hook_args.agent_id]
help = "Subagent ID when the hook fires inside a subagent (absent on the main thread). Auto-populated from stdin JSON 'agent_id'. A stop-failure carrying it is a subagent's API error — the main turn continues, so it is ignored."

[claude.cli.arg.hook_args.background_tasks]
help = "Background tasks still attached to the session, as a JSON array. Auto-populated from stdin JSON 'background_tasks' on the Stop hook. A stop with any item whose status does not mean finished (completed, failed, cancelled, canceled, killed, stopped, error, done; unknown or missing status counts as unfinished) only ended the main response while background work continues, so the child stays active instead of going idle."

[claude.cli.arg.hook_args.waiting_on_background_work]
help = "Whether the session is waiting for background work to finish (\"true\"/\"false\"). Not in the official hooks documentation (checked 2026-09-28) or in observed Claude Code 2.1.283 payloads; read defensively from stdin JSON 'waiting_on_background_work' if it ever arrives, and when present it decides instead of --background-tasks."

[claude.cli.arg.hook_args.tool_name]
help = "Tool that ran, for the background-start event. Auto-populated from stdin JSON 'tool_name' on PostToolUse. Bash and Agent (Task) can start background work."

[claude.cli.arg.hook_args.tool_response]
help = "Tool result, for the background-start event. Auto-populated from stdin JSON 'tool_response' on PostToolUse. A background Bash command carries backgroundTaskId and a background Agent carries agentId; the plugin records them so that a StopFailure while that work still runs keeps the child active."

[claude.cli.arg.hook_args.prompt]
help = "Prompt text. Auto-populated from stdin JSON 'prompt' on UserPromptSubmit. A prompt that starts with <task-notification> reports finished background work by its <task-id>."

[claude.cli.arg.hook_args.source]
help = "How the session started (startup, resume, clear, compact, fork). Auto-populated from stdin JSON 'source' on SessionStart. A session reopened with resume records the --settings it was restored with, so the Stop-hook gates in it are counted."

[claude.cli.arg.hook_args.cwd]
help = "Working directory of the Claude session. Auto-populated from stdin JSON 'cwd'. While a child waits on background work, the plugin uses it with the session ID to find the output files of the awaited tasks under Claude Code's temporary folder and watches whether they still grow."

[claude.cli.arg.hook_args.reason]
help = "Why the session ended (clear, resume, logout, prompt_input_exit, other). Auto-populated from stdin JSON 'reason' on SessionEnd. Any value but clear and resume means the Claude process ended, so the settings recorded for it are forgotten."

[claude.cli.arg.hook_args.last_assistant_message]
help = "The assistant's final message of the turn. Auto-populated from stdin JSON 'last_assistant_message' on the Stop hook. When the surface runs a Tasty agent task, it is reported as that turn's final answer."

[claude.cli.arg.checklist_hook_args.surface]
help = "Surface ID the gate is firing for, used to look up that session's goal. Defaults to the caller's TASTY_SURFACE_ID."

[claude.cli.arg.checklist_hook_args.session_id]
help = "Claude Code session ID. Auto-populated from stdin JSON 'session_id'."

[claude.cli.arg.checklist_hook_args.prompt_id]
help = "Claude Code prompt/turn ID — changes on each new user turn, stays fixed within a blocked extension chain. Auto-populated from stdin JSON 'prompt_id'."

[claude.cli.arg.checklist_hook_args.stop_hook_active]
help = "Whether Claude Code's own stop-hook-active flag was set (sanity-check only, not the primary decision signal). Auto-populated from stdin JSON 'stop_hook_active' (\"true\"/\"false\")."

[claude.cli.arg.checklist_hook_args.last_assistant_message]
help = "The assistant's last message text, searched for the completion sentinel. Auto-populated from stdin JSON 'last_assistant_message'."

[claude.cli.arg.checklist_hook_args.block_cap]
help = "Claude Code's cap on consecutive Stop-hook blocks (CLAUDE_CODE_STOP_HOOK_BLOCK_CAP). The gate command passes the environment value; empty means the default 8. A block that reaches the cap does not continue the turn, so the child is reported idle."

[claude.cli.arg.checklist_hook_args.gate]
help = "Name of the Stop-hook gate whose body, sentinel and round limit this hook decides with (see 'claude gate-register'). Defaults to the built-in continue-checklist gate."

[claude.cli.arg.checklist_gate_args.gate]
help = "Name of the Stop-hook gate to turn on/off/query (see 'claude gate-register'). Defaults to the built-in continue-checklist gate."

[claude.cli.arg.profile_register_args.name]
help = "Short name to register the profile under (lowercase letters, digits, '-', max 32 chars)"

[claude.cli.arg.profile_register_args.file]
help = "Path to the settings JSON file to register (copied into plugin-private storage)"

[claude.cli.arg.profile_name_args.name]
help = "Registered profile short name"

[claude.cli.arg.profile_current_args.surface]
help = "Surface ID to query (defaults to caller's TASTY_SURFACE_ID)"

[claude.cli.arg.gate_register_args.name]
help = "Short name to register the gate under (lowercase letters, digits, '-', max 32 chars). Shares one namespace with session profile names — registering a name that already exists on the other side is rejected rather than silently shadowed."

[claude.cli.arg.gate_register_args.body_file]
help = "Path to the checklist body (markdown) to register (copied into plugin-private storage). Must contain this gate's effective sentinel — without it the model is never told how to declare completion."

[claude.cli.arg.gate_register_args.sentinel]
help = "Completion sentinel the model must emit to end the turn. Defaults to the built-in sentinel. Cannot be empty (an empty sentinel matches every message)."

[claude.cli.arg.gate_register_args.rounds]
help = "Round-limit backstop for this gate (1 or greater). Omit to fall back to the plugin setting 'continue-checklist round limit'."

[claude.cli.arg.gate_name_args.name]
help = "Registered gate short name"

[claude.cli.arg.spawn_args.model]
help = "Model for this child session only (alias, full ID or provider identifier). Overrides profile model without editing it; retained on same-session restore. Omit to use Claude defaults."

[claude.cli.arg.spawn_args.effort]
help = "Effort for this child session only: low|medium|high|xhigh|max|ultracode. Overrides profile effort without editing it; retained on same-session restore. Availability depends on Claude CLI and model."
