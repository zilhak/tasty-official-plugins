[claude.cli.arg.respawn_args.workspace]
help = "자식이 있는 워크스페이스(ID 또는 이름). 자식이 여러 워크스페이스에 있는 Codex 대화에서 호출할 때만 씁니다"

[claude.cli.arg.reboot_args.clear_profile]
help = "재개 전에 기존 세션 프로필 부착 해제(경로 또는 이름 기반)"

[claude.cli.arg.reboot_args.permission_mode]
help = "자식 권한 모드: acceptEdits|auto|bypassPermissions|manual|dontAsk|plan. --permission-mode로 전달하며 이번 호출에는 default_permission_mode보다 우선합니다. 생략하면 해당 설정을 사용하고, inherit 또는 미설정일 때는 플래그 없이 Claude Code 설정을 따릅니다. 명시한 모드는 permissions.defaultMode를 정하는 --profile/--profile-file과 함께 쓸 수 없습니다."

[claude.cli.arg.child_profile_args.surface]
help = "부모 서피스 ID(기본값: 호출자의 TASTY_SURFACE_ID)"

[claude.cli.arg.child_profile_args.child_index]
help = "프로필을 부착할 자식 인덱스('claude children'에서 확인)"

[claude.cli.arg.child_profile_args.delay]
help = "자식 Claude 종료 전 대기 시간(초, 기본값: 5)"

[claude.cli.arg.child_profile_args.prompt]
help = "재시작한 자식의 재부팅 안내 프롬프트에 추가할 텍스트"

[claude.cli.arg.child_profile_args.profile_file]
help = "재개 시 자식에게 --settings로 부착할 Claude 세션 프로필(settings JSON). 자식 서피스에 저장되며 --clear-profile까지 다음 재부팅에 상속. --profile과 함께 사용 불가"

[claude.cli.arg.child_profile_args.profile]
help = "자식에게 부착할 등록 세션 프로필/Stop 훅 게이트 이름(복수는 쉼표 구분, 한 파일로 병합. 'claude profile-register', 'claude gate-register' 참조). 자식 서피스에 저장하고 재부팅마다 등록 정보를 다시 읽으며 --clear-profile까지 상속. --profile-file과 함께 사용 불가"

[claude.cli.arg.child_profile_args.clear_profile]
help = "재개 전에 자식의 기존 세션 프로필 부착 해제(경로 또는 이름 기반)"

[claude.cli.arg.child_profile_args.permission_mode]
help = "자식 권한 모드: acceptEdits|auto|bypassPermissions|manual|dontAsk|plan. --permission-mode로 전달하며 이번 호출에는 default_permission_mode보다 우선합니다. 생략하면 해당 설정을 사용하고, inherit 또는 미설정일 때는 플래그 없이 Claude Code 설정을 따릅니다. 명시한 모드는 permissions.defaultMode를 정하는 --profile/--profile-file과 함께 쓸 수 없습니다."

[claude.cli.arg.hook_args.event]
help = "훅 이벤트 이름(예: stop, stop-failure, notification, session-end, prompt-submit, session-start, subagent-stop, pre-tool-use, post-tool-use, background-start)"

[claude.cli.arg.hook_args.surface]
help = "훅 대상 서피스 ID(기본값: 호출자의 TASTY_SURFACE_ID)"

[claude.cli.arg.hook_args.session]
help = "Claude Code 세션 ID. 훅 호출 시 stdin JSON의 'session_id'에서 자동 입력"

[claude.cli.arg.hook_args.message]
help = "훅 메시지(알림 토큰 추출에 사용). stdin JSON의 'message'에서 자동 입력"

[claude.cli.arg.hook_args.notification_type]
help = "Claude Code 알림 하위 종류(예: permission_prompt, auth_success). stdin JSON의 'notification_type'에서 자동 입력. 알림이 needs_input을 기록할지, active를 기록할지, 상태를 그대로 둘지 정한다. 값이 없으면 needs_input을 기록하고 목록에 없는 값이면 상태를 그대로 둔다"

[claude.cli.arg.hook_args.error]
help = "턴을 끝낸 API 에러 종류(예: overloaded, rate_limit, server_error, authentication_failed). StopFailure 훅에서 stdin JSON의 'error'로 자동 입력"

[claude.cli.arg.hook_args.prompt_id]
help = "Claude Code의 프롬프트(턴) ID입니다. Stop 훅의 stdin JSON 'prompt_id'에서 자동 입력합니다. 이 Stop을 같은 턴의 Stop 훅 게이트 판정과 짝짓는 데 씁니다."

[claude.cli.arg.hook_args.agent_id]
help = "서브에이전트에서 발생한 훅의 agent_id입니다(메인 스레드에서는 없음). stdin JSON의 'agent_id'에서 자동 입력합니다. 이 값이 있는 stop-failure는 서브에이전트의 API 오류이므로 메인 턴을 중단한 것으로 처리하지 않습니다."

[claude.cli.arg.hook_args.background_tasks]
help = "세션에 남아 있는 백그라운드 작업 목록(JSON 배열). Stop 훅에서 stdin JSON의 'background_tasks'로 자동으로 채운다. 끝을 뜻하지 않는 status의 항목(끝 값은 completed, failed, cancelled, canceled, killed, stopped, error, done이며, 모르는 값이나 status가 없는 항목도 끝나지 않은 것으로 센다)이 있는 stop은 메인 응답만 끝난 것이고 백그라운드 작업은 계속되므로, 자식을 idle로 바꾸지 않고 active로 둔다."

[claude.cli.arg.hook_args.waiting_on_background_work]
help = "세션이 백그라운드 작업의 완료를 기다리는지 여부(\"true\"/\"false\"). 공식 hooks 문서(2026-09-28 확인)와 Claude Code 2.1.283 실측 payload에는 없지만, 오면 stdin JSON의 'waiting_on_background_work'로 방어적으로 채운다. 값이 있으면 --background-tasks 대신 이 값으로 판정한다."

[claude.cli.arg.hook_args.tool_name]
help = "background-start 이벤트에서 실행된 도구. PostToolUse의 stdin JSON 'tool_name'에서 자동으로 채웁니다. Bash와 Agent(Task)가 백그라운드 작업을 띄울 수 있습니다."

[claude.cli.arg.hook_args.tool_response]
help = "background-start 이벤트에서 도구 결과. PostToolUse의 stdin JSON 'tool_response'에서 자동으로 채웁니다. 백그라운드 Bash 명령은 backgroundTaskId를, 백그라운드 Agent는 agentId를 담습니다. 플러그인이 이를 기록해 그 작업이 남은 채 StopFailure가 오면 자식을 active로 둡니다."

[claude.cli.arg.hook_args.prompt]
help = "prompt 문자열. UserPromptSubmit의 stdin JSON 'prompt'에서 자동으로 채웁니다. <task-notification>으로 시작하는 prompt는 <task-id>로 끝난 백그라운드 작업을 알립니다."

[claude.cli.arg.hook_args.source]
help = "세션이 시작된 방식(startup, resume, clear, compact, fork). SessionStart의 stdin JSON 'source'에서 자동으로 채웁니다. resume으로 다시 연 세션은 복원에 쓴 --settings를 기록해 그 안의 Stop 훅 게이트를 셉니다."

[claude.cli.arg.hook_args.cwd]
help = "Claude 세션의 작업 폴더. stdin JSON 'cwd'에서 자동으로 채웁니다. 자식이 백그라운드 작업을 기다리는 동안 플러그인은 이 값과 세션 ID로 Claude Code 임시 폴더에서 기다리는 작업의 출력 파일을 찾고, 파일이 계속 늘어나는지 봅니다."

[claude.cli.arg.hook_args.reason]
help = "세션이 끝난 이유(clear, resume, logout, prompt_input_exit, other). SessionEnd의 stdin JSON 'reason'에서 자동으로 채웁니다. clear와 resume 외의 값은 Claude 프로세스가 끝났다는 뜻이라 그 프로세스에 기록한 settings를 지웁니다."

[claude.cli.arg.hook_args.last_assistant_message]
help = "턴의 마지막 assistant 메시지. Stop 훅의 stdin JSON 'last_assistant_message'에서 자동으로 채웁니다. 이 surface가 Tasty agent task를 실행 중이면 그 턴의 최종 답변으로 보고합니다."

[claude.cli.arg.checklist_hook_args.surface]
help = "게이트 대상 서피스 ID. 해당 세션의 목표 조회에 사용. 기본값은 호출자의 TASTY_SURFACE_ID"

[claude.cli.arg.checklist_hook_args.session_id]
help = "Claude Code 세션 ID. stdin JSON의 'session_id'에서 자동 입력"

[claude.cli.arg.checklist_hook_args.prompt_id]
help = "Claude Code 프롬프트/턴 ID. 새 사용자 턴마다 바뀌고 차단 후 연장 중에는 유지됩니다. stdin JSON의 'prompt_id'에서 자동 입력"

[claude.cli.arg.checklist_hook_args.stop_hook_active]
help = "Claude Code 자체 stop-hook-active 플래그 설정 여부(주 판정 신호가 아닌 정합 확인용). stdin JSON의 'stop_hook_active'(\"true\"/\"false\")에서 자동 입력"

[claude.cli.arg.checklist_hook_args.last_assistant_message]
help = "완료 표식을 찾을 assistant의 마지막 메시지. stdin JSON의 'last_assistant_message'에서 자동 입력"

[claude.cli.arg.checklist_hook_args.block_cap]
help = "Claude Code가 Stop 훅 block을 연속으로 받아들이는 상한(CLAUDE_CODE_STOP_HOOK_BLOCK_CAP)입니다. 게이트 명령이 환경 변수 값을 넘기며, 비어 있으면 기본값 8을 씁니다. 상한에 도달한 block은 턴을 잇지 않으므로 자식을 idle로 보고합니다."

[claude.cli.arg.checklist_hook_args.gate]
help = "본문·완료 표식·회차 제한으로 판정할 Stop 훅 게이트 이름('claude gate-register' 참조). 기본값은 내장 continue-checklist"

[claude.cli.arg.checklist_gate_args.gate]
help = "활성화/비활성화/조회할 Stop 훅 게이트 이름('claude gate-register' 참조). 기본값은 내장 continue-checklist"

[claude.cli.arg.profile_register_args.name]
help = "프로필 등록 이름(영문 소문자·숫자·'-', 최대 32자)"

[claude.cli.arg.profile_register_args.file]
help = "등록할 settings JSON 파일 경로(plugin 전용 저장소에 복사)"

[claude.cli.arg.profile_name_args.name]
help = "등록된 프로필 이름"

[claude.cli.arg.profile_current_args.surface]
help = "조회할 서피스 ID(기본값: 호출자의 TASTY_SURFACE_ID)"

[claude.cli.arg.gate_register_args.name]
help = "게이트 등록 이름(영문 소문자·숫자·'-', 최대 32자). 세션 프로필도 같은 이름 목록을 사용하므로 이미 등록된 프로필 이름은 사용할 수 없습니다."

[claude.cli.arg.gate_register_args.body_file]
help = "등록할 체크리스트 본문 마크다운 경로(plugin 전용 저장소에 복사). 모델에 완료 선언법을 알려주도록 이 게이트의 유효 완료 표식이 반드시 포함되어야 합니다."

[claude.cli.arg.gate_register_args.sentinel]
help = "턴을 끝낼 때 모델이 출력할 완료 표식. 기본값은 내장 표식. 빈 값은 모든 메시지에 일치하므로 금지"

[claude.cli.arg.gate_register_args.rounds]
help = "게이트 회차 상한(1 이상). 생략하면 plugin의 'continue-checklist round limit' 설정 사용"

[claude.cli.arg.gate_name_args.name]
help = "등록된 게이트 이름"

[claude.cli.arg.spawn_args.model]
help = "이 자식 세션의 모델(alias, full ID 또는 provider 식별자). 프로필을 수정하지 않고 모델보다 우선하며 같은 세션 복원에도 유지합니다. 생략하면 Claude 기본값을 따릅니다."

[claude.cli.arg.spawn_args.effort]
help = "이 자식 세션의 effort: low|medium|high|xhigh|max|ultracode. 프로필을 수정하지 않고 effort보다 우선하며 같은 세션 복원에도 유지합니다. 지원 여부는 Claude CLI와 모델에 따라 다릅니다."
