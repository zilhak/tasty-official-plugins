[claude.cli.sub.notify-error]
description = "内部用：子の出力が長時間変わらず、処理が止まっている可能性を呼び出し元に通知します。claude-error-stalled の hook.set コマンドで使用します。子の状態は変更せず、完了フックの削除・再登録もしません。"

[claude.cli.sub.notify-done]
