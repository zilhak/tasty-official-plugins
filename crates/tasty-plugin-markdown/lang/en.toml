# 콜아웃(GFM alert `> [!NOTE]` 5종 + Obsidian 확장 타입) 기본 헤더 레이블 — render/callout.rs::
# CALLOUT_KINDS 가 조회. 커스텀 제목(`[!type] Title`)이 있으면 이 값 대신 그 텍스트를 쓴다.
