# 주소 띠 버튼 tooltip·aria-label, 원격 직접 이동의 실패 종류별 행과 대기 행. 디자인 갤러리 Markdown 주소 띠의 문구다.
# {reason} 은 원격이 보낸 영어 사유 원문이며 번역하지 않는다.
[markdown.address]
go = "이동"
open = "파일 열기…"
open_remote = "원격 파일 열기…"
reload = "새로 고침"
stale = "원격 파일이 바뀌었습니다 — 새로 고침"
disconnected = "원격 연결이 끊겼습니다"
waiting = "원격의 응답을 기다리는 중…"

[markdown.address.error]
not_found = "원격에서 {path} 파일을 열 수 없습니다: 파일이 없습니다."
rejected = "원격에서 {path} 파일을 열 수 없습니다: {reason}"
connection_lost = "원격이 응답하기 전에 연결이 끊겼습니다. 다시 연결한 뒤 시도하세요."
cancelled = "원격 연결이 바뀌어 {path} 파일을 열지 않았습니다. 다시 시도하세요."
internal = "{path} 파일을 여는 요청을 보내지 못했습니다. 다시 시도하세요."

[markdown.find]
placeholder = "문서 내 검색"
match_count = "{current}/{total}"
prev_tooltip = "이전 매치"
next_tooltip = "다음 매치"
close_tooltip = "닫기 (Esc)"

[markdown.toc]
label = "목차"
aria_label = "목차"

# GFM alert blockquote(`> [!NOTE]` 등) 헤더 레이블 — render/callout.rs::CALLOUT_KINDS 가 조회.
[markdown.alert]
note = "참고"
tip = "팁"
important = "중요"
warning = "경고"
caution = "주의"
abstract = "요약"
info = "정보"
todo = "할 일"
success = "성공"
question = "질문"
failure = "실패"
danger = "위험"
bug = "버그"
example = "예제"
quote = "인용"

# 각주 참조/backlink 앵커의 aria-label — render.rs::rewrite_footnote_event 가 조회.
[markdown.footnote]
ref_aria = "각주 {}(으)로 이동"
backlink_aria = "각주 {}에서 본문으로 돌아가기"
backlink_aria_nth = "각주 {0}의 {1}번째 참조로 돌아가기"

[markdown.copy]
label = "코드 복사"
copied = "복사됨!"
failed = "복사 실패"

# 프리셋 편집기 필드 라벨 (호스트가 t() 로 해석).
[preset.field]
file = "파일"
file_hint = "마크다운 파일 경로"

[markdown.settings]
allow_remote = "원격 콘텐츠 허용"

[markdown.cli.sub.reload]
description = "로컬 파일을 다시 읽거나 원격 문서를 다시 요청합니다"

[markdown.cli.sub.recent]
description = "최근에 연 마크다운 파일 나열(최신순, 최대 10개)"

[markdown.cli.arg.reload_args.surface]
help = "대상 서피스 ID"
