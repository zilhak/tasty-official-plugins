# cargo deny checks only the license policy here: run it as
# `cargo deny --workspace check licenses` (scripts/check.sh licenses).
# Advisories stay with cargo audit (the audit job), and bans and sources are not checked.
# A plain `cargo deny check` would also run those checks with their defaults, so it is not
# the check of this repository.

[graph]
# Optional features count too. No targets: every platform's dependencies are checked,
# as the plugin version check reads every target.
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is tasty's (its deny.toml). Entries no crate here uses stay so the two
# lists do not drift; unused-allowed-license keeps them from warning.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "WTFPL",
  "MPL-2.0",         # file-level copyleft: linked only, unmodified
  "OFL-1.1",         # font assets
  "Ubuntu-font-1.0", # font assets
]
# No [[licenses.exceptions]]: a crate outside the policy is updated or replaced, not excused.
