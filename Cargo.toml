[workspace]
members = ["crates/*"]
resolver = "2"

# The plugin crates are workspace members under crates/. The tasty crates they
# use (SDK, protocol, manifest, and shared libraries) come from one tasty commit.
# To move the pin, change the rev below in every entry (and in [patch.crates-io]);
# the pin-check tests fail if the entries disagree.
[workspace.dependencies]
tasty-plugin-agent-common = { path = "crates/tasty-plugin-agent-common" }
tasty-egui-theme = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
tasty-git-core = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
tasty-i18n = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
tasty-icons = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc", default-features = false }
tasty-plugin-manifest = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
tasty-plugin-protocol = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
tasty-plugin-sdk = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
tasty-reaper = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
tasty-test-support = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
tasty-themes = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
tasty-type-appearance = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
tasty-ui-widgets = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
tasty-utils = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
serde_json = "1"
toml = "0.8"

# tasty patches tiny_http (vendor/tiny_http, see its PATCHES.md) and builds the
# agent-stream SSE server against that copy. Use the same copy here.
[patch.crates-io]
tiny_http = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }
# tasty patches epaint (vendor/epaint, see its PATCHES.md): glyphs too big for the
# font atlas are left blank instead of panicking, and the atlas image stops growing
# at its width. Use the same copy here.
epaint = { git = "https://github.com/zilhak/tasty", rev = "e277fce41d9a2db8bf3c14fda8f56dd6415bfcbc" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_assignments = "deny"
unused_must_use = "deny"
dead_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

# Same as tasty so the plugin binaries match what tasty ships.
[profile.release]
lto = "thin"
strip = true
opt-level = 3

[profile.dist]
inherits = "release"
lto = true
