name: CI

# Checks, tests, and builds the plugin crates in this repository on every
# supported platform. Every command except the WebKitGTK tests goes through
# scripts/check.sh, so CI and local checks run the same steps. Runners and
# action pins are described in docs/ci.md.

on:
  push:
    branches: [develop, release, main]
  pull_request:
    branches: [develop, release, main]
  workflow_dispatch:

permissions:
  contents: read

# A push to a branch does not cancel the run in progress, as in tasty: on the
# self-hosted runners a run can take longer than the time between pushes, and a
# waiting run is replaced by the newer push anyway. Pull requests only need the
# latest commit. The group only covers runs of this repository; see docs/ci.md.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Fail instead of installing a missing toolchain into the runner's shared
  # RUSTUP_HOME. rustup 1.28.1 and later install it by default; see docs/ci.md.
  RUSTUP_AUTO_INSTALL: "0"

defaults:
  run:
    # Git Bash on Windows runners.
    shell: bash

jobs:
  check:
    name: fmt, clippy, test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner service may start without the rustup proxies on PATH, as on
      # tasty's Linux runners.
      - name: Setup PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The toolchain in rust-toolchain.toml must already be on the runner; see
      # docs/ci.md. Jobs do not install toolchains, targets, or packages.
      - name: Show toolchain
        run: |
          if ! rustup show active-toolchain || ! cargo --version; then
            echo "::error::The toolchain in rust-toolchain.toml is not installed on this runner; see docs/ci.md#what-the-runners-need"
            exit 1
          fi

      # tasty-plugin-markdown's Linux dev-dependencies (webkit2gtk, gtk,
      # javascriptcore-rs) link against WebKitGTK 4.1 (libwebkit2gtk-4.1-dev, which
      # brings the GTK 3, JavaScriptCore, and libsoup 3 headers). The packages must
      # already be installed on the runner; this step only checks for them.
      - name: Check system packages
        run: |
          pkg-config --exists webkit2gtk-4.1 javascriptcoregtk-4.1 gtk+-3.0 libsoup-3.0 || {
            echo "::error::WebKitGTK 4.1 development files are missing on this runner; see docs/ci.md"
            exit 1
          }

      - name: fmt
        run: scripts/check.sh fmt
      - name: clippy
        run: scripts/check.sh lint
      - name: test
        run: scripts/check.sh test

      # The markdown address bar and focus sheet tests open a real WebKitGTK view
      # (Linux only). They are #[ignore] and named here, with the same commands as
      # tasty's crossplatform-check.yml. As in tasty, a failure is reported but does
      # not fail the job yet.
      - name: test (linux, webview layout)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          command -v xvfb-run || { echo "xvfb-run is missing on this runner"; exit 1; }
          env -u WAYLAND_DISPLAY xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            cargo test -p tasty-plugin-markdown --locked --no-fail-fast -- --ignored --exact \
              render::webview_layout_tests::address_bar_stays_on_top_in_webkitgtk
          # GTK initializes on one thread per process, so each test runs on its own.
          env -u WAYLAND_DISPLAY xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            cargo test -p tasty-plugin-markdown --locked --no-fail-fast -- --ignored --exact \
              render::bed_focus_webkit_tests::bed_focus_sheet_switches_state_values_in_place

  # Unit tests with the Windows and macOS code paths. The Windows and Linux ARM64
  # targets are only built, in the build job; see docs/ci.md.
  test:
    name: test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: [self-hosted, Windows, X64]
          - platform: macos-arm64
            runner: [self-hosted, macOS, ARM64]
    steps:
      # Git for Windows may be installed without its bash on PATH, and the WSL
      # bash in System32 may come first on PATH. Find bash.exe next to git and put
      # its folder first on PATH, so the later shell: bash steps use Git Bash.
      - name: Find Git for Windows bash (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $git = Get-Command git -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $git) {
            Write-Output "::error::git is not on PATH; see docs/ci.md#what-the-runners-need"
            exit 1
          }
          # git.exe is in <Git>\cmd, <Git>\bin, or <Git>\mingw64\bin, and bash.exe is
          # in <Git>\bin. If git is a shim elsewhere, `git --exec-path` (for example
          # <Git>/mingw64/libexec/git-core) still leads to <Git>.
          $starts = @((Split-Path -Parent $git.Source))
          $exec = (& git --exec-path 2>$null)
          if ($exec) { $starts += [System.IO.Path]::GetFullPath($exec.Trim()) }
          $bash = $null
          foreach ($start in $starts) {
            $root = $start
            for ($i = 0; $i -lt 3 -and $root -and -not $bash; $i++) {
              $root = Split-Path -Parent $root
              if (-not $root) { break }
              $candidate = Join-Path $root 'bin\bash.exe'
              if (Test-Path -LiteralPath $candidate) { $bash = $candidate }
            }
            if ($bash) { break }
          }
          if (-not $bash) {
            Write-Output "::error::Git for Windows bash.exe not found near $($git.Source); see docs/ci.md#what-the-runners-need"
            exit 1
          }
          Write-Output "Git for Windows bash: $bash"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $bash)

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show bash (Windows)
        if: runner.os == 'Windows'
        run: |
          command -v bash
          # sed reads all of its input; head could exit while bash still writes.
          bash --version | sed -n 1p

      # The toolchain in rust-toolchain.toml must already be on the runner; see
      # docs/ci.md. Jobs do not install toolchains, targets, or packages.
      - name: Show toolchain
        run: |
          if ! rustup show active-toolchain || ! cargo --version; then
            echo "::error::The toolchain in rust-toolchain.toml is not installed on this runner; see docs/ci.md#what-the-runners-need"
            exit 1
          fi

      - name: clippy
        run: scripts/check.sh lint
      - name: test (lib, bins)
        run: scripts/check.sh test --lib --bins --no-fail-fast

      # The repo-gates integration tests run the version-bump gate's shell scripts, so
      # macOS checks them with the BSD tools. Windows does not run them.
      # Their fixture workspaces resolve with cargo --offline.
      - name: Fetch dependencies (macOS)
        if: runner.os == 'macOS'
        run: cargo fetch --locked
      # Under the runner tool cache, never in ~/.cargo/bin; reused by later runs of the same pin.
      - name: Install strip-cfg-test (macOS)
        if: runner.os == 'macOS'
        run: |
          bin=$(bash scripts/install-judge.sh)
          if [ -z "$bin" ] || [ ! -x "$bin" ]; then
            echo "::error::install-judge.sh gave no runnable strip-cfg-test: '$bin'"
            exit 1
          fi
          echo "TASTY_STRIP_CFG_TEST_BIN=$bin" >> "$GITHUB_ENV"
      - name: test (repo-gates, macOS)
        if: runner.os == 'macOS'
        run: cargo test --locked -p repo-gates

  # shellcheck on every shell script and actionlint on every workflow. Both tools are
  # downloaded from their release pages, checked against pinned SHA-256 sums, and kept
  # in the runner tool cache, so the runner needs nothing but network access.
  lint:
    name: shellcheck, actionlint
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck and actionlint (runner tool cache)
        run: |
          dir=$(bash scripts/install-lint-tools.sh)
          if [ -z "$dir" ] || [ ! -x "$dir/shellcheck" ] || [ ! -x "$dir/actionlint" ]; then
            echo "::error::install-lint-tools.sh gave no runnable tools: '$dir'"
            exit 1
          fi
          echo "$dir" >> "$GITHUB_PATH"

      # actionlint also runs the shellcheck above on the workflows' run blocks.
      - name: shellcheck, actionlint
        run: bash scripts/lint-scripts.sh

  # Separate job: a new advisory fails this job without touching check and build.
  audit:
    name: cargo audit
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner service may start without the rustup proxies on PATH, as on
      # tasty's Linux runners.
      - name: Setup PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The toolchain in rust-toolchain.toml must already be on the runner; see
      # docs/ci.md. Jobs do not install toolchains, targets, or packages.
      - name: Show toolchain
        run: |
          if ! rustup show active-toolchain || ! cargo --version; then
            echo "::error::The toolchain in rust-toolchain.toml is not installed on this runner; see docs/ci.md#what-the-runners-need"
            exit 1
          fi

      # Installed under this runner's tool cache, not in ~/.cargo/bin, and reused
      # by later runs of the same version.
      - name: Install cargo-audit (runner tool cache)
        run: |
          root="$RUNNER_TOOL_CACHE/cargo-audit/$CARGO_AUDIT_VERSION"
          if [ ! -x "$root/bin/cargo-audit" ]; then
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --root "$root"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: cargo audit
        run: scripts/check.sh audit

  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            target: x86_64-pc-windows-msvc
            runner: [self-hosted, Windows, X64]
          - platform: windows-arm64
            target: aarch64-pc-windows-msvc
            runner: [win-arm64]
          - platform: macos-arm64
            target: aarch64-apple-darwin
            runner: [self-hosted, macOS, ARM64]
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            runner: [self-hosted, Linux, X64]
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: [self-hosted, Linux, ARM64]
    steps:
      # Git for Windows may be installed without its bash on PATH, and the WSL
      # bash in System32 may come first on PATH. Find bash.exe next to git and put
      # its folder first on PATH, so the later shell: bash steps use Git Bash.
      - name: Find Git for Windows bash (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $git = Get-Command git -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $git) {
            Write-Output "::error::git is not on PATH; see docs/ci.md#what-the-runners-need"
            exit 1
          }
          # git.exe is in <Git>\cmd, <Git>\bin, or <Git>\mingw64\bin, and bash.exe is
          # in <Git>\bin. If git is a shim elsewhere, `git --exec-path` (for example
          # <Git>/mingw64/libexec/git-core) still leads to <Git>.
          $starts = @((Split-Path -Parent $git.Source))
          $exec = (& git --exec-path 2>$null)
          if ($exec) { $starts += [System.IO.Path]::GetFullPath($exec.Trim()) }
          $bash = $null
          foreach ($start in $starts) {
            $root = $start
            for ($i = 0; $i -lt 3 -and $root -and -not $bash; $i++) {
              $root = Split-Path -Parent $root
              if (-not $root) { break }
              $candidate = Join-Path $root 'bin\bash.exe'
              if (Test-Path -LiteralPath $candidate) { $bash = $candidate }
            }
            if ($bash) { break }
          }
          if (-not $bash) {
            Write-Output "::error::Git for Windows bash.exe not found near $($git.Source); see docs/ci.md#what-the-runners-need"
            exit 1
          }
          Write-Output "Git for Windows bash: $bash"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $bash)

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show bash (Windows)
        if: runner.os == 'Windows'
        run: |
          command -v bash
          # sed reads all of its input; head could exit while bash still writes.
          bash --version | sed -n 1p

      # The runner service may start without the rustup proxies on PATH, as on
      # tasty's Linux runners.
      - name: Setup PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The toolchain in rust-toolchain.toml must already be on the runner; see
      # docs/ci.md. Jobs do not install toolchains, targets, or packages.
      - name: Show toolchain
        run: |
          if ! rustup show active-toolchain || ! cargo --version; then
            echo "::error::The toolchain in rust-toolchain.toml is not installed on this runner; see docs/ci.md#what-the-runners-need"
            exit 1
          fi

      # windows-arm64 is cross-built on an x64 Windows host, as in tasty.
      - name: Check target
        run: |
          # Read first, then grep: with pipefail, grep -q ending early can make the
          # listing die of SIGPIPE and turn a match into a failure.
          targets=$(rustup target list --installed | tr -d '\r')
          grep -qx '${{ matrix.target }}' <<<"$targets" || {
            echo "::error::Rust target ${{ matrix.target }} is not installed on this runner; see docs/ci.md"
            exit 1
          }

      - name: Build plugins
        run: scripts/check.sh build --target ${{ matrix.target }}

      # .cargo/config.toml links the MSVC C runtime statically. Fail if a plugin
      # binary still imports the VC++ runtime DLLs.
      - name: List plugin executables (Windows)
        if: runner.os == 'Windows'
        run: |
          scripts/check.sh build --target ${{ matrix.target }} \
            --message-format=json-render-diagnostics > "$RUNNER_TEMP/artifacts.jsonl"
      - name: Inspect DLL imports with dumpbin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $exes = Get-Content (Join-Path $env:RUNNER_TEMP 'artifacts.jsonl') |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable } |
            ForEach-Object { $_.executable }
          if (-not $exes) { throw 'no plugin executables reported by cargo' }
          $bad = @()
          foreach ($exe in $exes) {
            $deps = & $dumpbin /nologo /dependents $exe
            Write-Output "== $exe"
            $deps | Select-String '\.dll' | ForEach-Object { Write-Output $_.Line.Trim() }
            if ($deps -match '(?i)vcruntime|msvcp|api-ms-win-crt') { $bad += $exe }
          }
          if ($bad) { throw "dynamic CRT imports in: $($bad -join ', ')" }
          Write-Output "static CRT: $($exes.Count) executables import no VC++ runtime DLLs"
