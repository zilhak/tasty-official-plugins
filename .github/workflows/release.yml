name: Release

# A v* tag push releases the plugins as a pre-release: create-release checks the
# tag and opens a draft pre-release, release-meta and package build the release
# files on every platform as workflow artifacts, and publish uploads them to the
# draft and publishes it as a pre-release, never as Latest. If create-release
# fails, no Release is created; if a later job fails before the publish request,
# the Release stays a draft. If the check after the publish request fails, the
# Release stays published (see docs/ci.md#failures-and-reruns). Only promote.yml marks a Release as Latest, after a published Tasty release
# bundles it. A manual run (workflow_dispatch) builds the same files as workflow
# artifacts and creates no Release. The packages are not signed. See docs/ci.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only create-release and publish get write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Fail instead of installing a missing toolchain into the runner's shared
  # RUSTUP_HOME. rustup 1.28.1 and later install it by default; see docs/ci.md.
  RUSTUP_AUTO_INSTALL: "0"
  # Relative so Git Bash tar on Windows never sees a drive letter.
  PKG_OUT: target/package
  GH_REPO: ${{ github.repository }}
  # The plugins and platforms of one release: 8 plugins x 5 platforms.
  PLUGIN_COUNT: "8"
  PLATFORMS: windows-x64 windows-arm64 macos-arm64 linux-x64 linux-arm64

defaults:
  run:
    shell: bash

jobs:
  # create-release, release-meta, and publish build nothing for a platform, so any Linux
  # runner takes them. Only the package matrix is tied to its platform's runner.
  create-release:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      # The main check needs the history of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Released versions live on main. A tag on a commit that is not on main is
      # not released, as in tasty.
      - name: Verify the tag commit is on main
        id: commit
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit=$(git rev-parse "HEAD^{commit}")
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::Tag $TAG points at $tag_commit, which is not on origin/main"
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      # VERSION must be a SemVer core version without leading zeros, the same
      # versions that promotion compares.
      - name: Check the tag against VERSION
        run: |
          version=$(tr -d '\r\n' < VERSION)
          scripts/release-check.sh tag "$TAG" "$version"

      # This workflow never changes a published Release; only promote.yml changes
      # the state and notes of one. A draft from an earlier run of the same tag is
      # reused only if the Commit line of its marker block names the same commit;
      # publish then checks the files and the notes already on it.
      - name: Create or reuse the draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commit=$(git rev-parse "HEAD^{commit}")
          marker="Commit: $commit"
          if is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>"$RUNNER_TEMP/view.err"); then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $TAG is already published; it is never overwritten"
              exit 1
            fi
            gh release view "$TAG" --json body --jq '.body' > "$RUNNER_TEMP/draft-notes.md"
            if ! found=$(scripts/release-check.sh marker "$RUNNER_TEMP/draft-notes.md" Commit) ||
              [[ "$found" != "$commit" ]]; then
              echo "::error::The draft Release $TAG was made for another commit; delete the draft and run again"
              exit 1
            fi
            echo "Reusing the draft Release $TAG for $commit"
            exit 0
          fi
          if ! grep -q 'release not found' "$RUNNER_TEMP/view.err"; then
            cat "$RUNNER_TEMP/view.err" >&2
            exit 1
          fi
          tasty_rev=$(grep -F 'https://github.com/zilhak/tasty"' Cargo.toml |
            grep -o 'rev = "[0-9a-f]\{40\}"' | sed 's/rev = "\(.*\)"/\1/' | sort -u)
          pending=$(scripts/release-check.sh pending-line "$tasty_rev")
          # The commit body is free text; the marker block after it is what the
          # release checks read.
          {
            git log -1 --format=%b "$commit"
            echo
            echo "$marker"
            echo "tasty rev: $tasty_rev"
            echo "$pending"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --draft --prerelease --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  release-meta:
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner service may start without the rustup proxies on PATH, as on
      # tasty's Linux runners.
      - name: Setup PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          if ! rustup show active-toolchain || ! cargo --version; then
            echo "::error::The toolchain in rust-toolchain.toml is not installed on this runner; see docs/ci.md#what-the-runners-need"
            exit 1
          fi

      # A manual run is not a release, so its tag is "unreleased".
      - name: Write release-meta.toml
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag=unreleased
          [[ "$EVENT" == "push" ]] && tag="$REF_NAME"
          mkdir -p "$RUNNER_TEMP/release-meta"
          scripts/release-meta.sh --tag "$tag" --out "$RUNNER_TEMP/release-meta/release-meta.toml"
          cat "$RUNNER_TEMP/release-meta/release-meta.toml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-meta
          path: ${{ runner.temp }}/release-meta/release-meta.toml
          if-no-files-found: error

  package:
    name: package ${{ matrix.platform }}
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            target: x86_64-pc-windows-msvc
            runner: [self-hosted, Windows, X64]
          - platform: windows-arm64
            target: aarch64-pc-windows-msvc
            runner: [win-arm64]
          - platform: macos-arm64
            target: aarch64-apple-darwin
            runner: [self-hosted, macOS, ARM64]
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            runner: [self-hosted, Linux, X64]
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: [self-hosted, Linux, ARM64]
    steps:
      # Git for Windows may be installed without its bash on PATH, and the WSL
      # bash in System32 may come first on PATH. Find bash.exe next to git and put
      # its folder first on PATH, so the later shell: bash steps use Git Bash.
      - name: Find Git for Windows bash (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $git = Get-Command git -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $git) {
            Write-Output "::error::git is not on PATH; see docs/ci.md#what-the-runners-need"
            exit 1
          }
          # git.exe is in <Git>\cmd, <Git>\bin, or <Git>\mingw64\bin, and bash.exe is
          # in <Git>\bin. If git is a shim elsewhere, `git --exec-path` (for example
          # <Git>/mingw64/libexec/git-core) still leads to <Git>.
          $starts = @((Split-Path -Parent $git.Source))
          $exec = (& git --exec-path 2>$null)
          if ($exec) { $starts += [System.IO.Path]::GetFullPath($exec.Trim()) }
          $bash = $null
          foreach ($start in $starts) {
            $root = $start
            for ($i = 0; $i -lt 3 -and $root -and -not $bash; $i++) {
              $root = Split-Path -Parent $root
              if (-not $root) { break }
              $candidate = Join-Path $root 'bin\bash.exe'
              if (Test-Path -LiteralPath $candidate) { $bash = $candidate }
            }
            if ($bash) { break }
          }
          if (-not $bash) {
            Write-Output "::error::Git for Windows bash.exe not found near $($git.Source); see docs/ci.md#what-the-runners-need"
            exit 1
          }
          Write-Output "Git for Windows bash: $bash"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $bash)

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show bash (Windows)
        if: runner.os == 'Windows'
        run: |
          command -v bash
          # sed reads all of its input; head could exit while bash still writes.
          bash --version | sed -n 1p

      # The runner service may start without the rustup proxies on PATH, as on
      # tasty's Linux runners.
      - name: Setup PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The toolchain in rust-toolchain.toml must already be on the runner; see
      # docs/ci.md. Jobs do not install toolchains, targets, or packages.
      - name: Show toolchain
        run: |
          if ! rustup show active-toolchain || ! cargo --version; then
            echo "::error::The toolchain in rust-toolchain.toml is not installed on this runner; see docs/ci.md#what-the-runners-need"
            exit 1
          fi

      # windows-arm64 is cross-built on an x64 Windows host, as in tasty.
      - name: Check target
        run: |
          targets=$(rustup target list --installed | tr -d '\r')
          grep -qx '${{ matrix.target }}' <<<"$targets" || {
            echo "::error::Rust target ${{ matrix.target }} is not installed on this runner; see docs/ci.md"
            exit 1
          }

      # 1. Build with the dist profile and stage <id>/ folders. Every release
      # holds all plugins, including those whose manifest says bundle = false
      # (--all), so tasty's development builds can take them too.
      - name: Build and stage
        run: |
          scripts/package-plugin.sh stage --all --platform ${{ matrix.platform }} \
            --out "$PKG_OUT" --target ${{ matrix.target }} --profile dist

      # 2. Archive each <id>/ folder and write the SHA-256 lists. The packages are
      # not signed, and pack fails if a .sig file would go into an archive.
      - name: Pack
        run: scripts/package-plugin.sh pack --platform ${{ matrix.platform }} --out "$PKG_OUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins-${{ matrix.platform }}
          path: ${{ env.PKG_OUT }}/${{ matrix.platform }}/dist/
          if-no-files-found: error

  # Runs only when every job above succeeded. Otherwise the Release stays a
  # draft. Files are uploaded without --clobber: a file already on the draft is
  # kept only if its hash matches, so a published file never changes. The
  # Release is published as a pre-release; promote.yml marks it Latest later.
  publish:
    needs: [create-release, release-meta, package]
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # For scripts/release-check.sh, which reads the SHA-256 lists and the release notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/release-artifacts

      # Checks every SHA-256 list and the expected files, then gathers the files
      # to upload in one folder: per platform, 8 archives, SHA256SUMS-<platform>.txt
      # and plugins-<platform>.tsv, plus one release-meta.toml.
      - name: Verify the release files
        env:
          ARTIFACTS: ${{ runner.temp }}/release-artifacts
          DIST: ${{ runner.temp }}/release-dist
          COMMIT: ${{ needs.create-release.outputs.commit }}
        run: |
          rm -rf "$DIST"
          mkdir -p "$DIST"
          lists="${RUNNER_TEMP:?}/release-lists"
          rm -rf "$lists"
          mkdir -p "$lists"
          expected=1
          for platform in $PLATFORMS; do
            dir="$ARTIFACTS/plugins-$platform"
            [[ -d "$dir" ]] || { echo "::error::missing artifact plugins-$platform"; exit 1; }
            # Every line of the SHA-256 list is judged as promotion (check 7) judges it;
            # release-check.sh reports a bad list itself.
            scripts/release-check.sh sums "$dir/SHA256SUMS-$platform.txt" publish > "$lists/sums-$platform.txt" || exit 1
            # The list names each archive of the artifact once, and no other file.
            cut -d' ' -f1 "$lists/sums-$platform.txt" | sort > "$lists/listed-$platform.txt"
            find "$dir" -maxdepth 1 -name "*-$platform.tar.gz" -printf '%f\n' | sort > "$lists/archives-$platform.txt"
            if ! diff "$lists/listed-$platform.txt" "$lists/archives-$platform.txt" > "$lists/diff-$platform.txt"; then
              sed 's/^/  /' "$lists/diff-$platform.txt"
              echo "::error::$platform: SHA256SUMS-$platform.txt lists other files than the archives of the artifact (< list, > artifact)"
              exit 1
            fi
            (cd "$dir" && sha256sum -c "SHA256SUMS-$platform.txt")
            archives=$(wc -l < "$lists/archives-$platform.txt")
            rows=$(($(wc -l < "$dir/plugins-$platform.tsv") - 1))
            if [[ "$archives" != "$PLUGIN_COUNT" || "$rows" != "$PLUGIN_COUNT" ]]; then
              echo "::error::$platform: $archives archives, $rows TSV rows; expected $PLUGIN_COUNT each"
              exit 1
            fi
            cp "$dir"/* "$DIST/"
            expected=$((expected + PLUGIN_COUNT + 2))
          done
          meta="$ARTIFACTS/release-meta/release-meta.toml"
          [[ -f "$meta" ]] || { echo "::error::missing artifact release-meta"; exit 1; }
          grep -qxF "tag = \"$TAG\"" "$meta" || { echo "::error::release-meta.toml is not for $TAG"; exit 1; }
          grep -qxF "commit = \"$COMMIT\"" "$meta" || { echo "::error::release-meta.toml is not for $COMMIT"; exit 1; }
          plugins=$(grep -cx '\[\[plugin\]\]' "$meta" || true)
          [[ "$plugins" == "$PLUGIN_COUNT" ]] || { echo "::error::release-meta.toml lists $plugins plugins"; exit 1; }
          cp "$meta" "$DIST/"
          found=$(find "$DIST" -type f | wc -l)
          if [[ "$found" != "$expected" ]]; then
            echo "::error::found $found release files, expected $expected"
            exit 1
          fi
          echo "verified $found release files"

      # A file that is already on the draft (from an earlier attempt) is kept if
      # its hash matches and fails the job if it differs: delete the draft and
      # run again. A file on the draft that this run did not build also fails.
      - name: Upload to the draft Release
        env:
          DIST: ${{ runner.temp }}/release-dist
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Release $TAG is not a draft; it is never changed"
            exit 1
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/existing.txt"
          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            if [[ ! -f "$DIST/$name" ]]; then
              echo "::error::The draft has $name, which this run did not build; delete the draft and run again"
              exit 1
            fi
          done < "$RUNNER_TEMP/existing.txt"
          check="$RUNNER_TEMP/existing-assets"
          for file in "$DIST"/*; do
            name=$(basename "$file")
            if grep -qxF "$name" "$RUNNER_TEMP/existing.txt"; then
              rm -rf "$check"
              mkdir -p "$check"
              gh release download "$TAG" --pattern "$name" --dir "$check"
              if [[ "$(sha256sum < "$check/$name")" != "$(sha256sum < "$file")" ]]; then
                echo "::error::$name on the draft differs from this build; delete the draft and run again"
                exit 1
              fi
              echo "kept $name (same hash)"
            else
              gh release upload "$TAG" "$file"
              echo "uploaded $name"
            fi
          done

      # The notes are settled and checked before the Release is published: the
      # marker block gets exactly one pending Requires Tasty line, and its Commit,
      # tasty rev, and pending pin must match release-meta.toml. Otherwise the
      # Release stays a draft. The checked notes go out with the publish request,
      # so the published notes are the checked ones. --prerelease is given again
      # in case the draft lost it.
      - name: Publish the Release as a pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META: ${{ runner.temp }}/release-artifacts/release-meta/release-meta.toml
        run: |
          is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Release $TAG is not a draft; it is never changed"
            exit 1
          fi
          gh release view "$TAG" --json body --jq '.body' > "$RUNNER_TEMP/draft-notes.md"
          scripts/release-check.sh prepare "$RUNNER_TEMP/draft-notes.md" "$META" > "$RUNNER_TEMP/release-notes.md"
          scripts/release-check.sh verify "$RUNNER_TEMP/release-notes.md" "$META"
          gh release edit "$TAG" --draft=false --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"

      # GitHub never makes a pre-release Latest. This checks it: the Release is
      # published, a pre-release, and not the Latest Release. No Latest Release
      # at all passes; a failed lookup fails. A failure here leaves the Release
      # published; see docs/ci.md#failures-and-reruns.
      - name: Check the published state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(gh release view "$TAG" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          if [[ "$state" != "false true" ]]; then
            echo "::error::Release $TAG is not a published pre-release (isDraft isPrerelease: $state)"
            exit 1
          fi
          latest=$(scripts/release-check.sh latest)
          if [[ "$latest" == "$TAG" ]]; then
            echo "::error::Release $TAG is the Latest Release; only promote.yml marks Latest"
            exit 1
          fi
          echo "Release $TAG is a pre-release; Latest is ${latest:-none}"
